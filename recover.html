<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recover Data</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0efeb;color:#1a1a1a;padding:20px;}
  h1{font-size:18px;font-weight:700;margin-bottom:6px;}
  p{font-size:14px;color:#555;line-height:1.7;margin-bottom:12px;}
  .card{background:#fff;border-radius:12px;border:1px solid #e0ddd6;padding:16px;margin-bottom:12px;}
  .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
  .btn-primary{background:#1a1a1a;color:#fff;}
  .btn-primary:active{background:#333;}
  .result{margin-top:12px;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;display:none;}
  .result.ok{background:#f0fdf4;border:1px solid #86efac;color:#166534;}
  .result.err{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;}
  .count{font-size:13px;color:#888;margin-top:4px;}
</style>
</head>
<body>

<div style="margin-bottom:20px">
  <h1>Data Recovery</h1>
  <p>This page finds your old transaction data and moves it into the current version of the app.</p>
</div>

<div class="card" id="scan-card">
  <p style="font-weight:600;font-size:14px;margin-bottom:4px">Step 1 — Scan for old data</p>
  <p>Checks all known storage keys for your saved transactions.</p>
  <button class="btn btn-primary" onclick="scan()">Scan now</button>
  <div class="result" id="scan-result"></div>
</div>

<div class="card" id="migrate-card" style="display:none">
  <p style="font-weight:600;font-size:14px;margin-bottom:4px">Step 2 — Restore data</p>
  <p id="migrate-desc"></p>
  <button class="btn btn-primary" onclick="migrate()">Restore transactions</button>
  <div class="result" id="migrate-result"></div>
</div>

<div class="card">
  <p style="font-weight:600;font-size:14px;margin-bottom:4px">All storage keys (for debugging)</p>
  <div class="count" id="all-keys">Tap scan to view</div>
</div>

<script>
const KEYS=['ke_tx_v3','ke_tx_v4','ke_tx_v5','ke_transactions','ke_tx'];
let foundKey=null, foundData=null;

function scan(){
  const allKeys=[];
  for(let i=0;i<localStorage.length;i++) allKeys.push(localStorage.key(i));
  document.getElementById('all-keys').textContent=allKeys.length?allKeys.join(', '):'No keys found in local storage.';

  let best=null, bestCount=0;
  for(const key of KEYS){
    const raw=localStorage.getItem(key);
    if(!raw)continue;
    try{
      const arr=JSON.parse(raw);
      if(Array.isArray(arr)&&arr.length>bestCount){
        best=key; bestCount=arr.length; foundData=arr;
      }
    }catch(e){}
  }

  const el=document.getElementById('scan-result');
  el.style.display='block';

  if(!best){
    el.className='result err';
    el.textContent='No old transaction data found. Your data may have been in a different browser or was cleared.';
    return;
  }

  foundKey=best;
  el.className='result ok';
  el.textContent='Found '+bestCount+' transactions stored under key "'+best+'".';

  const current=localStorage.getItem('ke_tx_v5');
  let currentCount=0;
  try{ const c=JSON.parse(current||'[]'); currentCount=Array.isArray(c)?c.length:0; }catch(e){}

  const migrateDesc=document.getElementById('migrate-desc');
  migrateDesc.textContent='Will merge '+bestCount+' recovered transactions with your '+currentCount+' current transactions (duplicates skipped by ref code).';
  document.getElementById('migrate-card').style.display='block';
}

function migrate(){
  if(!foundData){alert('Please scan first.');return;}

  const currentRaw=localStorage.getItem('ke_tx_v5');
  let current=[];
  try{ current=JSON.parse(currentRaw||'[]'); }catch(e){}

  const existingRefs=new Set(current.map(t=>t.ref).filter(Boolean));
  const toAdd=foundData.filter(t=>!t.ref||!existingRefs.has(t.ref));
  const merged=[...current,...toAdd];

  localStorage.setItem('ke_tx_v5',JSON.stringify(merged));

  const el=document.getElementById('migrate-result');
  el.style.display='block';
  el.className='result ok';
  el.textContent='Done! Restored '+toAdd.length+' transactions ('+(foundData.length-toAdd.length)+' duplicates skipped). Go back to the expense tracker and your data will be there.';
}
</script>
</body>
</html>
